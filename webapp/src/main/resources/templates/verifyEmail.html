<p th:text="#{email.verify.greeting(${userName})}"></p>

<p th:text="#{email.verify.intro}"></p>

<p style="font-size:18px;">
    <b th:text="${token}"></b>
</p>

<p>
    <a th:href="${verificationLink}" target="_blank"
       style="display:inline-block; padding:10px 20px; background-color:#4CAF50; color:white; text-decoration:none; border-radius:5px;"
       th:text="#{email.verify.button}"></a>
</p>

<p th:text="#{email.verify.expiry(${expiryHours})}"></p>
<p th:text="#{email.verify.ignore}"></p>
<p th:text="#{email.verify.thanks}"></p>
