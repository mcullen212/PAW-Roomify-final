<!DOCTYPE html>

<body style="margin:0; padding:0; font-family: Arial, sans-serif; background:#f9f9f9; color:#333;">

    <!-- HEADER -->
    <tr>
        <td style="background:#1d4ed8; color:#fff; padding:20px; text-align:center; font-size:20px; font-weight:bold;">
            Roomify
        </td>
    </tr>

    <!-- BODY (contenido dinámico) -->
    <tr>
        <td style="padding:20px;" th:utext="${body}"></td>
    </tr>

    <!-- FOOTER -->
    <tr>
        <td style="background:#f1f1f1; text-align:center; padding:15px; font-size:12px; color:#777;" th:text="#{email.base.footer}">
        </td>
    </tr>
</table>
</body>
</html>
